<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#87B8D8" />
  <meta name="screen-orientation" content="landscape" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />
  <title>City Explorer</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="ui">
    <div id="start-screen">
      <div class="title-block">
        <h1>CITY</h1>
        <h2>EXPLORER</h2>
        <p>Walk the streets · Switch cameras · Explore</p>
      </div>
      <button id="start-btn">ENTER CITY</button>
      <p class="hint">Best in landscape · Install as app for fullscreen</p>
    </div>

    <div id="hud" class="hidden">
      <div id="joystick-zone">
        <div id="joystick-base">
          <div id="joystick-knob"></div>
        </div>
      </div>
      <div id="look-zone"></div>
      <button id="jump-btn" aria-label="Jump">↑</button>
      <button id="cam-btn" aria-label="Camera mode">CAM</button>
      <button id="task-btn" aria-label="Tasks">TASKS</button>
      <button id="interact-btn" class="hidden" aria-label="Interact">OPEN DOOR</button>
      <div id="crosshair">+</div>
      <div id="bars">
        <div class="bar-row"><span class="bar-label">HUNGER</span><div class="bar-track"><div id="hunger-fill" class="bar-fill"></div></div></div>
        <div class="bar-row"><span class="bar-label">ENERGY</span><div class="bar-track"><div id="energy-fill" class="bar-fill"></div></div></div>
      </div>
      <div id="task-panel" class="hidden">
        <div class="task-title">TASKS</div>
        <ul id="task-list"></ul>
      </div>
      <div id="toast" class="hidden"></div>
      <div id="status">
        <span id="cam-label">1st</span> · <span id="fps">60</span> FPS
      </div>
    </div>
  </div>

  <canvas id="c"></canvas>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./game.js?v=27"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.warn);
      });
    }
  </script>
</body>
</html>
